services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: meetingbook
      POSTGRES_USER: meetingbook_app
      POSTGRES_PASSWORD: ${MEETINGBOOK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingbook_app -d meetingbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      MEETINGBOOK_DB_URL: jdbc:postgresql://db:5432/meetingbook
      MEETINGBOOK_DB_USERNAME: meetingbook_app
      MEETINGBOOK_DB_PASSWORD: ${MEETINGBOOK_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: