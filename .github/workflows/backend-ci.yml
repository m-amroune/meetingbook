
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: meetingbook
          POSTGRES_USER: meetingbook_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetingbook_app -d meetingbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MEETINGBOOK_DB_URL: jdbc:postgresql://localhost:5432/meetingbook
      MEETINGBOOK_DB_USERNAME: meetingbook_app
      MEETINGBOOK_DB_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests and build
        run: bash ./mvnw -B verify
